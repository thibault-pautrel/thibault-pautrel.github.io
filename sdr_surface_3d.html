<!doctype html>
<meta charset="utf-8" />
<!--
  Animated 3D version of the SDR "local surrogate" figure.
    - vertical axis  : g(x) = E[Y | X = x]            (the response surface)
    - floor plane     : the 2D predictor space, points X_i (black)
    - green line      : span(B), the 1-D sufficient subspace
    - green dots      : orthogonal projections of X_i onto span(B)
    - red dots        : responses Y_i = g(.) lifted onto the surface
  Self-contained: only depends on three.js core from a CDN. Drag to rotate,
  scroll to zoom. Embed by hosting this file and <iframe>-ing it, or paste
  the markup straight into a page.
-->
<style>
  :root {
    --green:  #1f7a1f;   /* span(B)          */
    --red:    #b21e1e;   /* Y_i / responses  */
    --blue:   #1f5fae;   /* surface mesh     */
    --ink:    #333;
  }
  #sdr-wrap {
    position: relative;
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
    aspect-ratio: 4 / 3;
    background: #ffffff;
    border-radius: 10px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #sdr-wrap canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #sdr-wrap canvas:active { cursor: grabbing; }
  #sdr-ui {
    position: absolute; left: 12px; bottom: 12px;
    display: flex; gap: 8px; align-items: center;
  }
  #sdr-ui button {
    font: inherit; font-size: 13px;
    border: 1px solid #d9d9d9; background: #fff; color: var(--ink);
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  #sdr-ui button:hover { background: #f4f4f4; }
  #sdr-ui button[aria-pressed="true"] { background: #eef4ff; border-color: #b9d2ff; }
  #sdr-legend {
    position: absolute; right: 12px; top: 12px;
    font-size: 12.5px; color: var(--ink); line-height: 1.5;
    background: rgba(255,255,255,.7); padding: 6px 9px; border-radius: 8px;
    backdrop-filter: blur(2px);
  }
  #sdr-legend .sw { display:inline-block; width:10px; height:10px; border-radius:50%;
                    margin-right:6px; vertical-align:middle; }
</style>

<div id="sdr-wrap">
  <div id="sdr-legend">
    <div><span class="sw" style="background:var(--green)"></span>span(B)</div>
    <div><span class="sw" style="background:#111"></span>X<sub>i</sub> (predictors)</div>
    <div><span class="sw" style="background:var(--red)"></span>Y<sub>i</sub> = g(B<sup>⊤</sup>X)</div>
  </div>
  <div id="sdr-ui">
    <button id="sdr-replay" title="Replay the projection animation">↻ Replay</button>
    <button id="sdr-spin" aria-pressed="true" title="Toggle auto-rotation">⟳ Auto-rotate</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from "three";

/* ----------------------------------------------------------------------
   Model: the response surface and the data, taken from the TikZ source.
---------------------------------------------------------------------- */
const G = (x, y) => 1.6 * Math.exp(-(((x - 2) ** 2) / 1.8 + ((y - 1.4) ** 2) / 1.1));

// span(B): unit direction (vx,vy) anchored at (bcx,bcy)
const vx = 0.8, vy = 0.6, bcx = 2.0, bcy = 1.4;

// predictor cloud X_i (floor coordinates), from \cloud
const CLOUD = [
  [0.6,0.7],[1.0,1.9],[1.5,0.5],[1.8,2.3],[2.2,1.0],
  [2.5,2.4],[2.9,0.8],[3.2,1.9],[0.9,2.5],[3.5,1.3],
];

// domain: x in [0,4], y in [0,3]; centre it so rotation looks balanced.
const CX = 2.0, CY = 1.5;
// world mapping: worldX = x - CX, worldY = g (up), worldZ = y - CY
const P = (x, y, g = 0) => new THREE.Vector3(x - CX, g, y - CY);

// orthogonal projection of (px,py) onto span(B)
function projectOntoB(px, py) {
  const t = (px - bcx) * vx + (py - bcy) * vy;
  return [bcx + t * vx, bcy + t * vy];
}

/* ----------------------------------------------------------------------
   Renderer / scene / camera
---------------------------------------------------------------------- */
const wrap = document.getElementById("sdr-wrap");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);

scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 0.6);
key.position.set(4, 8, 6);
scene.add(key);

const root = new THREE.Group();          // everything rotatable
scene.add(root);

/* ----------------------------------------------------------------------
   Floor plane (predictor space at g = 0)
---------------------------------------------------------------------- */
{
  const w = 4, d = 3;
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.05,
                                  side: THREE.DoubleSide, depthWrite: false })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, 0, 0);
  root.add(floor);

  const border = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, d)),
    new THREE.LineBasicMaterial({ color: 0x9a9a9a })
  );
  border.rotation.x = -Math.PI / 2;
  root.add(border);
}

/* ----------------------------------------------------------------------
   Response surface g(x,y): translucent skin + blue wireframe gridlines
---------------------------------------------------------------------- */
{
  const NX = 48, NY = 36;
  const surfGeo = new THREE.PlaneGeometry(4, 3, NX, NY);
  const pos = surfGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const ox = pos.getX(i), oy = pos.getY(i);   // plane coords == world x,z here
    const g = G(ox + CX, oy + CY);              // data coords -> height
    pos.setXYZ(i, ox, g, oy);                   // (worldX, worldY=up, worldZ)
  }
  pos.needsUpdate = true;
  surfGeo.computeVertexNormals();
  const skin = new THREE.Mesh(
    surfGeo,
    new THREE.MeshStandardMaterial({
      color: 0x9cc2f0, transparent: true, opacity: 0.28,
      side: THREE.DoubleSide, roughness: 0.9, metalness: 0,
      depthWrite: false,
    })
  );
  root.add(skin);

  // gridlines, like the TikZ mesh
  const lineMat  = new THREE.LineBasicMaterial({ color: 0x1f5fae, transparent: true, opacity: 0.75 });
  const lineMat2 = new THREE.LineBasicMaterial({ color: 0x4f7fc0, transparent: true, opacity: 0.40 });

  for (let yk = 0; yk <= 3.0001; yk += 0.5) {     // curves along x
    const pts = [];
    for (let s = 0; s <= 40; s++) { const x = 4 * s / 40; pts.push(P(x, yk, G(x, yk))); }
    root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
  }
  for (let xk = 0; xk <= 4.0001; xk += 0.5) {     // curves along y
    const pts = [];
    for (let s = 0; s <= 30; s++) { const y = 3 * s / 30; pts.push(P(xk, y, G(xk, y))); }
    root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), lineMat2));
  }
}

/* ----------------------------------------------------------------------
   Helpers: thick line (cylinder) + arrow cone
---------------------------------------------------------------------- */
function tube(a, b, color, r = 0.018) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(r, r, len, 14),
    new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0 })
  );
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return mesh;
}
function cone(at, dir, color, r = 0.07, h = 0.18) {
  const mesh = new THREE.Mesh(
    new THREE.ConeGeometry(r, h, 16),
    new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0 })
  );
  mesh.position.copy(at);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return mesh;
}

/* ----------------------------------------------------------------------
   g-axis (vertical), at the floor corner
---------------------------------------------------------------------- */
{
  const grey = 0x808080;
  const a = P(0, 0, 0), top = P(0, 0, 2.35);
  root.add(tube(a, top, grey, 0.012));
  root.add(cone(P(0, 0, 2.45), new THREE.Vector3(0, 1, 0), grey, 0.06, 0.18));
}

/* ----------------------------------------------------------------------
   span(B): green double-headed arrow in the floor plane
---------------------------------------------------------------------- */
{
  const green = 0x1f7a1f;
  const e1 = P(bcx - 2.3 * vx, bcy - 2.3 * vy, 0);
  const e2 = P(bcx + 2.0 * vx, bcy + 2.0 * vy, 0);
  root.add(tube(e1, e2, green, 0.024));
  const dir = new THREE.Vector3().subVectors(e2, e1).normalize();
  root.add(cone(e2, dir, green, 0.08, 0.22));
  root.add(cone(e1, dir.clone().negate(), green, 0.08, 0.22));
}

/* ----------------------------------------------------------------------
   Per-point dynamic geometry (animated)
---------------------------------------------------------------------- */
const sphereGeo = new THREE.SphereGeometry(1, 18, 14);
const matBlack = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
const matGreen = new THREE.MeshStandardMaterial({ color: 0x1f7a1f, roughness: 0.5 });
const matRed   = new THREE.MeshStandardMaterial({ color: 0xb21e1e, roughness: 0.5 });

const dotProjMat = new THREE.LineDashedMaterial({ color: 0x9a9a9a, dashSize: 0.07, gapSize: 0.05 });
const liftMat    = new THREE.LineBasicMaterial({ color: 0x9a9a9a, transparent: true, opacity: 0.7 });

const items = CLOUD.map(([px, py]) => {
  const [qx, qy] = projectOntoB(px, py);
  const Xpos = P(px, py, 0);
  const Qpos = P(qx, qy, 0);
  const Spos = P(qx, qy, G(qx, qy));   // response lifted to surface

  const xDot = new THREE.Mesh(sphereGeo, matBlack); xDot.scale.setScalar(0.05); xDot.position.copy(Xpos);
  const gDot = new THREE.Mesh(sphereGeo, matGreen); gDot.scale.setScalar(0.0001);
  const rDot = new THREE.Mesh(sphereGeo, matRed);   rDot.scale.setScalar(0.0001);
  root.add(xDot, gDot, rDot);

  const projLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([Xpos, Xpos]), dotProjMat);
  const liftLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([Qpos, Qpos]), liftMat);
  root.add(projLine, liftLine);

  return { Xpos, Qpos, Spos, gDot, rDot, projLine, liftLine };
});

/* ----------------------------------------------------------------------
   Text labels (canvas sprites)
---------------------------------------------------------------------- */
function label(text, color, pos, scale = 0.6) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 128;
  const ctx = c.getContext("2d");
  ctx.font = "bold 64px system-ui, sans-serif";
  ctx.fillStyle = color; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, 128, 64);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.position.copy(pos); sp.scale.set(scale * 2, scale, 1);
  root.add(sp); return sp;
}
label("g", "#666", P(0, 0, 2.65), 0.4);
label("span(B)", "#1f7a1f", P(bcx + 2.0 * vx, bcy + 2.0 * vy, 0.0).add(new THREE.Vector3(0.35, 0.18, 0.2)), 0.42);
label("Xᵢ", "#111", items[6].Xpos.clone().add(new THREE.Vector3(0.18, 0.12, 0.0)), 0.36);
label("Yᵢ", "#b21e1e", items[5].Spos.clone().add(new THREE.Vector3(0.18, 0.18, 0.0)), 0.36);

/* ----------------------------------------------------------------------
   Animation timeline
---------------------------------------------------------------------- */
const N = items.length;
const PROJ_START = 0.6, STAGGER = 0.16, PROJ_DUR = 1.1;
const lastProjEnd = PROJ_START + (N - 1) * STAGGER + PROJ_DUR;
const LIFT_START = lastProjEnd + 0.25, LIFT_DUR = 0.9;
const lastLiftEnd = LIFT_START + (N - 1) * STAGGER + LIFT_DUR;
const LOOP_END = lastLiftEnd + 2.4;

const easeIO = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const clamp01 = t => Math.max(0, Math.min(1, t));
const lerpV = (a, b, t) => a.clone().lerp(b, t);

let tAnim = 0;
function applyAnim() {
  for (let i = 0; i < N; i++) {
    const it = items[i];
    const pp = easeIO(clamp01((tAnim - (PROJ_START + i * STAGGER)) / PROJ_DUR));
    const pl = easeIO(clamp01((tAnim - (LIFT_START + i * STAGGER)) / LIFT_DUR));

    // projection: green dot slides X -> Q along the floor
    const gPos = lerpV(it.Xpos, it.Qpos, pp);
    it.gDot.position.copy(gPos);
    it.gDot.scale.setScalar(pp > 0 ? 0.055 * easeOut(clamp01(pp / 0.25)) : 0.0001);
    it.projLine.geometry.setFromPoints([it.Xpos, gPos]);
    it.projLine.computeLineDistances();
    it.projLine.visible = pp > 0;

    // lift: red dot rises Q -> surface
    const rPos = lerpV(it.Qpos, it.Spos, pl);
    it.rDot.position.copy(rPos);
    it.rDot.scale.setScalar(pl > 0 ? 0.062 * easeOut(clamp01(pl / 0.25)) : 0.0001);
    it.liftLine.geometry.setFromPoints([it.Qpos, rPos]);
    it.liftLine.visible = pl > 0;
  }
}
function resetAnim() { tAnim = 0; }

/* ----------------------------------------------------------------------
   Simple orbit controls + auto-rotate
---------------------------------------------------------------------- */
const target = new THREE.Vector3(0, 0.45, 0);
let radius = 7.2, theta = 0.85, phi = 0.98, autoSpin = true, dragging = false, lx = 0, ly = 0;

function placeCamera() {
  phi = Math.max(0.18, Math.min(1.45, phi));
  camera.position.set(
    target.x + radius * Math.sin(phi) * Math.sin(theta),
    target.y + radius * Math.cos(phi),
    target.z + radius * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(target);
}
const cv = renderer.domElement;
cv.addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointerup",   () => dragging = false);
cv.addEventListener("pointermove", e => {
  if (!dragging) return;
  theta -= (e.clientX - lx) * 0.006;
  phi   -= (e.clientY - ly) * 0.006;
  lx = e.clientX; ly = e.clientY;
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  radius = Math.max(4.2, Math.min(13, radius + e.deltaY * 0.01));
}, { passive: false });

/* ----------------------------------------------------------------------
   UI
---------------------------------------------------------------------- */
document.getElementById("sdr-replay").onclick = resetAnim;
const spinBtn = document.getElementById("sdr-spin");
spinBtn.onclick = () => { autoSpin = !autoSpin; spinBtn.setAttribute("aria-pressed", autoSpin); };

/* ----------------------------------------------------------------------
   Resize + loop
---------------------------------------------------------------------- */
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);
resize();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  tAnim += dt; if (tAnim > LOOP_END) tAnim = 0;
  if (autoSpin && !dragging) theta += dt * 0.25;
  applyAnim();
  placeCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
