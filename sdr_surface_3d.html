<!doctype html>
<meta charset="utf-8" />
<!--
  Animated 3D version of the SDR "single-index surface" figure.
    - vertical axis   : g(B'x) = E[Y | X = x]        (the response surface)
    - floor plane     : the predictor space, points X_i (black)
    - green line      : span(B), the 1-D sufficient subspace
    - green dots      : orthogonal projections of X_i onto span(B)
    - red dots        : responses Y_i lifted onto the surface
    - green arrows    : grad g(x), always parallel to span(B)
    - pale contours   : level sets of g, orthogonal to span(B)
  The surface is a RIDGE: it varies only along span(B) and is flat in every
  orthogonal direction. That is the geometric content of the single-index
  model, and it is what makes the contours straight and the gradients aligned.

  Self-contained: only depends on three.js core from a CDN. Drag to rotate,
  scroll to zoom.
-->
<style>
  :root {
    --green:  #1f7a1f;   /* span(B), gradients */
    --red:    #b21e1e;   /* Y_i / responses    */
    --blue:   #1f5fae;   /* surface mesh       */
    --ink:    #333;
  }
  #sdr-wrap {
    position: relative;
    width: 100%;
    max-width: 820px;
    margin: 0 auto;
    aspect-ratio: 4 / 3;
    background: #ffffff;
    border-radius: 10px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  #sdr-wrap canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #sdr-wrap canvas:active { cursor: grabbing; }
  #sdr-ui {
    position: absolute; left: 12px; bottom: 12px;
    display: flex; gap: 8px; align-items: center;
  }
  #sdr-ui button {
    font: inherit; font-size: 13px;
    border: 1px solid #d9d9d9; background: #fff; color: var(--ink);
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  #sdr-ui button:hover { background: #f4f4f4; }
  #sdr-ui button[aria-pressed="true"] { background: #eef4ff; border-color: #b9d2ff; }
  #sdr-legend {
    position: absolute; right: 12px; top: 12px;
    font-size: 12.5px; color: var(--ink); line-height: 1.5;
    background: rgba(255,255,255,.7); padding: 6px 9px; border-radius: 8px;
    backdrop-filter: blur(2px);
  }
  #sdr-legend .sw { display:inline-block; width:10px; height:10px; border-radius:50%;
                    margin-right:6px; vertical-align:middle; }
  #sdr-legend .bar { display:inline-block; width:10px; height:3px; border-radius:2px;
                     margin-right:6px; vertical-align:middle; }
  #sdr-caption {
    position: absolute; left: 12px; top: 12px;
    font-size: 12.5px; color: var(--ink);
    background: rgba(255,255,255,.7); padding: 6px 9px; border-radius: 8px;
    backdrop-filter: blur(2px); max-width: 46%;
  }
</style>

<div id="sdr-wrap">
  <div id="sdr-caption">g varies only along span(B)</div>
  <div id="sdr-legend">
    <div><span class="sw" style="background:var(--green)"></span>span(B)</div>
    <div><span class="sw" style="background:#111"></span>X<sub>i</sub> (predictors)</div>
    <div><span class="sw" style="background:var(--red)"></span>Y<sub>i</sub> = g(B<sup>⊤</sup>X<sub>i</sub>)</div>
    <div><span class="bar" style="background:var(--green)"></span>∇g(x) ∈ span(B)</div>
  </div>
  <div id="sdr-ui">
    <button id="sdr-replay" title="Replay the animation">↻ Replay</button>
    <button id="sdr-spin" aria-pressed="true" title="Toggle auto-rotation">⟳ Auto-rotate</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from "three";

/* ----------------------------------------------------------------------
   Model: a single-index ridge surface, taken from the TikZ source.
     t(x,y) = B'(x - c)          index (scalar)
     g(t)   = 0.25 + 1.15 * sigmoid(1.9 t)
   The surface depends on (x,y) ONLY through t, so it is constant along
   the direction orthogonal to B.
---------------------------------------------------------------------- */
const vx = 0.8, vy = 0.6;              // span(B): unit direction
const wx = -0.6, wy = 0.8;             // orthogonal direction (flat direction)
const bcx = 2.0, bcy = 1.4;            // anchor of span(B)

const idx  = (x, y) => (x - bcx) * vx + (y - bcy) * vy;
const gOft = t => 0.25 + 1.15 / (1 + Math.exp(-1.9 * t));
const gpOft = t => { const p = 1 / (1 + Math.exp(-1.9 * t)); return 1.15 * 1.9 * p * (1 - p); };
const G = (x, y) => gOft(idx(x, y));

// predictor cloud X_i (floor coordinates)
const CLOUD = [
  [0.6,0.7],[1.0,1.9],[1.5,0.5],[1.8,2.3],[2.2,1.0],
  [2.5,2.4],[2.9,0.8],[3.2,1.9],[0.9,2.5],[3.5,1.3],
];

// where the gradient arrows are drawn
const GRADPTS = [[0.6,0.7],[1.0,1.9],[2.0,0.6],[2.1,2.2],[2.9,0.8],[3.2,1.9]];

// domain x in [0,4], y in [0,3]; centre it so rotation looks balanced.
const XLO = 0, XHI = 4, YLO = 0, YHI = 3;
const CX = 2.0, CY = 1.5;
const P = (x, y, g = 0) => new THREE.Vector3(x - CX, g, y - CY);

function projectOntoB(px, py) {
  const t = idx(px, py);
  return [bcx + t * vx, bcy + t * vy];
}

// clip the line p0 + s*d to the floor rectangle; returns [sMin,sMax] or null
function clipToBox(px, py, dx, dy) {
  let sMin = -1e9, sMax = 1e9;
  const slab = (p, d, lo, hi) => {
    if (Math.abs(d) < 1e-9) return (p >= lo && p <= hi);
    let t1 = (lo - p) / d, t2 = (hi - p) / d;
    if (t1 > t2) { const tmp = t1; t1 = t2; t2 = tmp; }
    sMin = Math.max(sMin, t1); sMax = Math.min(sMax, t2);
    return true;
  };
  if (!slab(px, dx, XLO, XHI)) return null;
  if (!slab(py, dy, YLO, YHI)) return null;
  return sMin < sMax ? [sMin, sMax] : null;
}

/* ----------------------------------------------------------------------
   Renderer / scene / camera
---------------------------------------------------------------------- */
const wrap = document.getElementById("sdr-wrap");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);

scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 0.6);
key.position.set(4, 8, 6);
scene.add(key);

const root = new THREE.Group();
scene.add(root);

/* ----------------------------------------------------------------------
   Floor plane (predictor space at g = 0)
---------------------------------------------------------------------- */
{
  const w = XHI - XLO, d = YHI - YLO;
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(w, d),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.05,
                                  side: THREE.DoubleSide, depthWrite: false })
  );
  floor.rotation.x = -Math.PI / 2;
  root.add(floor);

  const border = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, d)),
    new THREE.LineBasicMaterial({ color: 0x9a9a9a })
  );
  border.rotation.x = -Math.PI / 2;
  root.add(border);
}

/* ----------------------------------------------------------------------
   Response surface: translucent skin + two families of lines.
     - profiles  : along B, they carry the sigmoid shape
     - contours  : orthogonal to B, dead straight and level (the ridge)
---------------------------------------------------------------------- */
{
  const NX = 56, NY = 42;
  const surfGeo = new THREE.PlaneGeometry(XHI - XLO, YHI - YLO, NX, NY);
  const pos = surfGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const ox = pos.getX(i), oy = pos.getY(i);
    pos.setXYZ(i, ox, G(ox + CX, oy + CY), oy);
  }
  pos.needsUpdate = true;
  surfGeo.computeVertexNormals();
  root.add(new THREE.Mesh(surfGeo, new THREE.MeshStandardMaterial({
    color: 0x9cc2f0, transparent: true, opacity: 0.30,
    side: THREE.DoubleSide, roughness: 0.9, metalness: 0, depthWrite: false,
  })));

  const profMat = new THREE.LineBasicMaterial({ color: 0x1f5fae, transparent: true, opacity: 0.75 });
  const contMat = new THREE.LineBasicMaterial({ color: 0x4f7fc0, transparent: true, opacity: 0.42 });

  // profiles: lines along B, offset by s along w
  for (let s = -2.0; s <= 2.001; s += 0.4) {
    const px = bcx + s * wx, py = bcy + s * wy;
    const seg = clipToBox(px, py, vx, vy);
    if (!seg) continue;
    const pts = [];
    for (let k = 0; k <= 48; k++) {
      const u = seg[0] + (seg[1] - seg[0]) * k / 48;
      const x = px + u * vx, y = py + u * vy;
      pts.push(P(x, y, G(x, y)));
    }
    root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), profMat));
  }

  // contours: lines orthogonal to B -> constant height
  for (let t = -2.4; t <= 2.601; t += 0.4) {
    const px = bcx + t * vx, py = bcy + t * vy;
    const seg = clipToBox(px, py, wx, wy);
    if (!seg) continue;
    const h = gOft(t);
    const a = P(px + seg[0] * wx, py + seg[0] * wy, h);
    const b = P(px + seg[1] * wx, py + seg[1] * wy, h);
    root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), contMat));
  }
}

/* ----------------------------------------------------------------------
   Helpers: thick line (cylinder) + arrow cone
---------------------------------------------------------------------- */
function tube(a, b, color, r = 0.018) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(r, r, len, 14),
    new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0 })
  );
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return mesh;
}
function cone(at, dir, color, r = 0.07, h = 0.18) {
  const mesh = new THREE.Mesh(
    new THREE.ConeGeometry(r, h, 16),
    new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0 })
  );
  mesh.position.copy(at);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return mesh;
}

/* ----------------------------------------------------------------------
   g-axis (vertical) and span(B) (green, in the floor plane)
---------------------------------------------------------------------- */
{
  const grey = 0x808080;
  root.add(tube(P(0, 0, 0), P(0, 0, 1.85), grey, 0.012));
  root.add(cone(P(0, 0, 1.95), new THREE.Vector3(0, 1, 0), grey, 0.06, 0.18));
}
{
  const green = 0x1f7a1f;
  const e1 = P(bcx - 2.3 * vx, bcy - 2.3 * vy, 0);
  const e2 = P(bcx + 2.0 * vx, bcy + 2.0 * vy, 0);
  root.add(tube(e1, e2, green, 0.024));
  const dir = new THREE.Vector3().subVectors(e2, e1).normalize();
  root.add(cone(e2, dir, green, 0.08, 0.22));
  root.add(cone(e1, dir.clone().negate(), green, 0.08, 0.22));
}

/* ----------------------------------------------------------------------
   Per-point dynamic geometry
---------------------------------------------------------------------- */
const sphereGeo = new THREE.SphereGeometry(1, 18, 14);
const matBlack = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
const matGreen = new THREE.MeshStandardMaterial({ color: 0x1f7a1f, roughness: 0.5 });
const matRed   = new THREE.MeshStandardMaterial({ color: 0xb21e1e, roughness: 0.5 });

const dashMat = new THREE.LineDashedMaterial({ color: 0x9a9a9a, dashSize: 0.07, gapSize: 0.05 });
const liftMat = new THREE.LineBasicMaterial({ color: 0x9a9a9a, transparent: true, opacity: 0.7 });

const items = CLOUD.map(([px, py]) => {
  const [qx, qy] = projectOntoB(px, py);
  const Xpos = P(px, py, 0);
  const Qpos = P(qx, qy, 0);
  const Spos = P(px, py, G(px, py));   // lift is vertical: same height as above Q

  const xDot = new THREE.Mesh(sphereGeo, matBlack); xDot.scale.setScalar(0.05); xDot.position.copy(Xpos);
  const gDot = new THREE.Mesh(sphereGeo, matGreen); gDot.scale.setScalar(0.0001);
  const rDot = new THREE.Mesh(sphereGeo, matRed);   rDot.scale.setScalar(0.0001);
  root.add(xDot, gDot, rDot);

  const projLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([Xpos, Xpos]), dashMat);
  const liftLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([Xpos, Xpos]), liftMat);
  root.add(projLine, liftLine);

  return { Xpos, Qpos, Spos, gDot, rDot, projLine, liftLine };
});

/* ----------------------------------------------------------------------
   Gradient arrows on the floor: direction always B, length |g'(t)|
---------------------------------------------------------------------- */
const UP = new THREE.Vector3(0, 1, 0);
const bDir = new THREE.Vector3(vx, 0, vy).normalize();
const grads = GRADPTS.map(([px, py]) => {
  const L = 0.9 * gpOft(idx(px, py)) + 0.12;
  const base = P(px, py, 0.012);

  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.021, 0.021, 1, 12),
    new THREE.MeshStandardMaterial({ color: 0x2e8b2e, roughness: 0.6 })
  );
  shaft.geometry.translate(0, 0.5, 0);          // grow from the base, not the centre
  shaft.quaternion.setFromUnitVectors(UP, bDir);
  shaft.position.copy(base);
  shaft.scale.y = 0.0001;

  const head = cone(base, bDir, 0x2e8b2e, 0.062, 0.15);
  head.visible = false;

  root.add(shaft, head);
  return { base, L, shaft, head };
});

/* ----------------------------------------------------------------------
   Text labels (canvas sprites)
---------------------------------------------------------------------- */
function label(text, color, pos, scale = 0.6) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 128;
  const ctx = c.getContext("2d");
  ctx.font = "bold 60px system-ui, sans-serif";
  ctx.fillStyle = color; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(text, 128, 64);
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  sp.position.copy(pos); sp.scale.set(scale * 2, scale, 1);
  root.add(sp); return sp;
}
label("g", "#666", P(0, 0, 2.15), 0.4);
label("span(B)", "#1f7a1f",
      P(bcx + 2.0 * vx, bcy + 2.0 * vy, 0).add(new THREE.Vector3(0.30, 0.16, 0.20)), 0.42);
label("Xᵢ", "#111", items[6].Xpos.clone().add(new THREE.Vector3(0.16, 0.12, 0.0)), 0.36);
label("Yᵢ", "#b21e1e", items[5].Spos.clone().add(new THREE.Vector3(0.16, 0.18, 0.0)), 0.36);

/* ----------------------------------------------------------------------
   Animation timeline
---------------------------------------------------------------------- */
const N = items.length;
const PROJ_START = 0.6, STAGGER = 0.14, PROJ_DUR = 1.0;
const projEnd  = PROJ_START + (N - 1) * STAGGER + PROJ_DUR;
const LIFT_START = projEnd + 0.25, LIFT_DUR = 0.85;
const liftEnd  = LIFT_START + (N - 1) * STAGGER + LIFT_DUR;
const GRAD_START = liftEnd + 0.35, GRAD_STAG = 0.12, GRAD_DUR = 0.7;
const gradEnd  = GRAD_START + (grads.length - 1) * GRAD_STAG + GRAD_DUR;
const LOOP_END = gradEnd + 2.6;

const easeIO  = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const clamp01 = t => Math.max(0, Math.min(1, t));
const lerpV = (a, b, t) => a.clone().lerp(b, t);

let tAnim = 0;
function applyAnim() {
  for (let i = 0; i < N; i++) {
    const it = items[i];
    const pp = easeIO(clamp01((tAnim - (PROJ_START + i * STAGGER)) / PROJ_DUR));
    const pl = easeIO(clamp01((tAnim - (LIFT_START + i * STAGGER)) / LIFT_DUR));

    const gPos = lerpV(it.Xpos, it.Qpos, pp);
    it.gDot.position.copy(gPos);
    it.gDot.scale.setScalar(pp > 0 ? 0.055 * easeOut(clamp01(pp / 0.25)) : 0.0001);
    it.projLine.geometry.setFromPoints([it.Xpos, gPos]);
    it.projLine.computeLineDistances();
    it.projLine.visible = pp > 0;

    const rPos = lerpV(it.Xpos, it.Spos, pl);
    it.rDot.position.copy(rPos);
    it.rDot.scale.setScalar(pl > 0 ? 0.062 * easeOut(clamp01(pl / 0.25)) : 0.0001);
    it.liftLine.geometry.setFromPoints([it.Xpos, rPos]);
    it.liftLine.visible = pl > 0;
  }

  for (let k = 0; k < grads.length; k++) {
    const gr = grads[k];
    const a = easeOut(clamp01((tAnim - (GRAD_START + k * GRAD_STAG)) / GRAD_DUR));
    const len = gr.L * a;
    gr.shaft.scale.y = Math.max(0.0001, len);
    gr.head.visible = a > 0.05;
    gr.head.position.copy(gr.base).addScaledVector(bDir, len + 0.075);
  }
}
function resetAnim() { tAnim = 0; }

/* ----------------------------------------------------------------------
   Orbit controls + auto-rotate
---------------------------------------------------------------------- */
const target = new THREE.Vector3(0, 0.45, 0);
let radius = 7.2, theta = 0.85, phi = 0.98, autoSpin = true, dragging = false, lx = 0, ly = 0;

function placeCamera() {
  phi = Math.max(0.18, Math.min(1.45, phi));
  camera.position.set(
    target.x + radius * Math.sin(phi) * Math.sin(theta),
    target.y + radius * Math.cos(phi),
    target.z + radius * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(target);
}
const cv = renderer.domElement;
cv.addEventListener("pointerdown", e => { dragging = true; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointerup",   () => dragging = false);
cv.addEventListener("pointermove", e => {
  if (!dragging) return;
  theta -= (e.clientX - lx) * 0.006;
  phi   -= (e.clientY - ly) * 0.006;
  lx = e.clientX; ly = e.clientY;
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  radius = Math.max(4.2, Math.min(13, radius + e.deltaY * 0.01));
}, { passive: false });

/* ----------------------------------------------------------------------
   UI
---------------------------------------------------------------------- */
document.getElementById("sdr-replay").onclick = resetAnim;
const spinBtn = document.getElementById("sdr-spin");
spinBtn.onclick = () => { autoSpin = !autoSpin; spinBtn.setAttribute("aria-pressed", autoSpin); };

/* ----------------------------------------------------------------------
   Resize + loop
---------------------------------------------------------------------- */
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);
resize();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  tAnim += dt; if (tAnim > LOOP_END) tAnim = 0;
  if (autoSpin && !dragging) theta += dt * 0.25;
  applyAnim();
  placeCamera();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
