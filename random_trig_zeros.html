<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeros of a random trigonometric polynomial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }

  .rtp {
    /* drafting-paper instrument palette */
    --panel:    #fcfdfe;
    --grid-soft:#e9eef3;
    --ink:      #15263b;   /* the curve */
    --zero:     #e0492b;   /* zero crossings */
    --limit:    #b9842a;   /* 2/sqrt3 line */
    --slate:    #56697a;
    --slate-2:  #8497a6;
    --hair:     #c9d4dd;

    box-sizing: border-box;
    width: 100%;
    margin: 0 auto;
    padding: 2px 0 4px;
    background: transparent;
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .rtp *, .rtp *::before, .rtp *::after { box-sizing: border-box; }

  .rtp .panel {
    background: var(--panel);
    border: 1px solid var(--hair);
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 14px;
  }
  .rtp canvas { display: block; width: 100%; height: auto; }

  /* readout strip */
  .rtp .readout {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--hair);
    border: 1px solid var(--hair);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .rtp .cell { background: var(--panel); padding: 12px 10px 13px; }
  .rtp .cell .k {
    font-size: 10.5px; letter-spacing: 0.04em; color: var(--slate-2);
    text-transform: uppercase; margin-bottom: 5px;
  }
  .rtp .cell .v {
    font-family: "IBM Plex Mono", monospace;
    font-size: clamp(17px, 3.8vw, 22px);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }
  .rtp .cell.accent .v { color: var(--zero); }
  .rtp .cell.target .v { color: var(--limit); }
  .rtp .cell .v small { font-size: 0.6em; color: var(--slate-2); font-weight: 400; }

  .rtp .chart-cap {
    font-size: 12px; color: var(--slate); margin: -4px 0 14px;
    display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
  }
  .rtp .chart-cap span { display: inline-flex; align-items: center; gap: 6px; }
  .rtp .swatch { width: 22px; height: 0; border-top-width: 2px; border-top-style: solid; }
  .rtp .dot { width: 7px; height: 7px; border-radius: 50%; }

  /* controls */
  .rtp .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .rtp button {
    font-family: "Inter", sans-serif; font-size: 13.5px; font-weight: 500;
    color: var(--panel); background: var(--ink);
    border: none; border-radius: 7px; padding: 9px 16px; cursor: pointer;
    transition: opacity .15s ease;
  }
  .rtp button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--hair); }
  .rtp button:hover { opacity: 0.85; }
  .rtp button:focus-visible { outline: 2px solid var(--zero); outline-offset: 2px; }
  .rtp .speed { display: flex; align-items: center; gap: 9px; margin-left: auto; color: var(--slate); font-size: 12.5px; }
  .rtp input[type=range] { width: 120px; accent-color: var(--ink); }

  @media (max-width: 520px) {
    .rtp .readout { grid-template-columns: repeat(2, 1fr); }
    .rtp .speed { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="rtp">
  <div class="panel">
    <canvas id="rtp-wave" aria-label="Graph of a random trigonometric polynomial with its zeros marked"></canvas>
  </div>

  <div class="readout">
    <div class="cell"><div class="k">degree&nbsp;n</div><div class="v" id="rtp-n">&mdash;</div></div>
    <div class="cell accent"><div class="k">zeros on [0,2&pi;]</div><div class="v" id="rtp-z">&mdash;</div></div>
    <div class="cell"><div class="k">mean N / n &nbsp;<small>(12 draws)</small></div><div class="v" id="rtp-r">&mdash;</div></div>
    <div class="cell target"><div class="k">limit 2/&radic;3</div><div class="v">1.1547</div></div>
  </div>

  <div class="panel">
    <canvas id="rtp-conv" aria-label="Convergence of the average zero count divided by degree toward 2 over root 3"></canvas>
  </div>
  <div class="chart-cap">
    <span><span class="dot" style="background:rgba(224,73,43,.45)"></span> one random polynomial</span>
    <span><span class="swatch" style="border-top-color:var(--ink)"></span> expected value E[N]/n</span>
    <span><span class="swatch" style="border-top-color:var(--limit);border-top-style:dashed"></span> 2/&radic;3</span>
  </div>

  <div class="controls">
    <button id="rtp-play">Pause</button>
    <button id="rtp-reset" class="ghost">Restart</button>
    <label class="speed">speed
      <input id="rtp-speed" type="range" min="0" max="100" value="55">
    </label>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---- constants -------------------------------------------------------
  var N_START = 4, N_MAX = 110, K = 12;          // K draws sampled per degree
  var TARGET  = 2 / Math.sqrt(3);                // 1.15470...
  var Y_RANGE = 4.2;                             // waveform vertical half-extent
  var Y_LO = 0.90, Y_HI = 1.60;                  // convergence chart y window

  // exact Kac–Rice expectation for this model: E[N]/n = (2/n)*sqrt((n+1)(2n+1)/6)
  function exactRatio(n) { return (2 / n) * Math.sqrt((n + 1) * (2 * n + 1) / 6); }
  var TWO_PI = Math.PI * 2;

  var css = getComputedStyle(document.querySelector(".rtp"));
  var C = {
    gridS: css.getPropertyValue("--grid-soft").trim(),
    ink:   css.getPropertyValue("--ink").trim(),
    zero:  css.getPropertyValue("--zero").trim(),
    limit: css.getPropertyValue("--limit").trim(),
    slate: css.getPropertyValue("--slate").trim(),
    slate2:css.getPropertyValue("--slate-2").trim(),
    hair:  css.getPropertyValue("--hair").trim()
  };

  // ---- randomness ------------------------------------------------------
  function randn() {                              // Box–Muller
    var u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(TWO_PI * v);
  }
  function sgn(x) { return x > 0 ? 1 : (x < 0 ? -1 : 0); }

  // One realization of degree n: zero count, curve values, zero locations.
  // f_n evaluated on a fine grid via the Chebyshev recurrence for cos(kt),
  // sin(kt) so the per-point cost is O(n) without trig calls.
  function realize(n, wantCurve) {
    var a = new Float64Array(n + 1), b = new Float64Array(n + 1), k;
    for (k = 1; k <= n; k++) { a[k] = randn(); b[k] = randn(); }

    var M = Math.max(2400, Math.ceil(26 * n));    // grid points over [0,2pi)
    var inv = 1 / Math.sqrt(n);
    var vals = new Float64Array(M);
    var i, t, ct, st, cprev, sprev, ccur, scur, cnext, snext, sum;

    for (i = 0; i < M; i++) {
      t = TWO_PI * i / M;
      ct = Math.cos(t); st = Math.sin(t);
      cprev = 1; sprev = 0;          // k = 0
      ccur = ct; scur = st;          // k = 1
      sum = a[1] * ccur + b[1] * scur;
      for (k = 2; k <= n; k++) {
        cnext = 2 * ct * ccur - cprev;
        snext = 2 * ct * scur - sprev;
        cprev = ccur; ccur = cnext;
        sprev = scur; scur = snext;
        sum += a[k] * cnext + b[k] * snext;
      }
      vals[i] = sum * inv;
    }

    // count sign changes around the loop (period 2pi)
    var count = 0, zeros = wantCurve ? [] : null;
    var prev = sgn(vals[0]), j, s, va, vb, frac;
    for (i = 1; i <= M; i++) {
      j = i % M;
      s = sgn(vals[j]);
      if (s !== 0 && prev !== 0 && s !== prev) {
        count++;
        if (wantCurve) {
          va = vals[i - 1]; vb = vals[j];
          frac = -va / (vb - va);
          zeros.push((i - 1 + frac) / M * TWO_PI);
        }
      }
      if (s !== 0) prev = s;
    }
    return { count: count, vals: wantCurve ? vals : null, M: M, zeros: zeros };
  }

  // K draws for one degree; keep the last draw's curve to plot.
  function step(n) {
    var ratios = [], total = 0, last = null, i, r;
    for (i = 0; i < K; i++) {
      last = realize(n, i === K - 1);
      r = last.count / n;
      ratios.push(r); total += r;
    }
    return { n: n, ratios: ratios, mean: total / K,
             count: last.count, curve: last.vals, M: last.M, zeros: last.zeros };
  }

  // ---- canvas setup ----------------------------------------------------
  function fitCanvas(cv, h) {
    var dpr = Math.max(1, window.devicePixelRatio || 1);
    var w = cv.clientWidth || cv.parentNode.clientWidth;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.height = h + "px";
    var ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: w, h: h };
  }

  var waveCv = document.getElementById("rtp-wave");
  var convCv = document.getElementById("rtp-conv");

  // ---- drawing: waveform ----------------------------------------------
  function drawWave(frame) {
    var H = Math.max(190, Math.min(280, waveCv.clientWidth * 0.42));
    var d = fitCanvas(waveCv, H), ctx = d.ctx, w = d.w, h = d.h;
    var padL = 14, padR = 14, padT = 14, padB = 22;
    var x0 = padL, x1 = w - padR, plotW = x1 - x0;
    var midY = padT + (h - padT - padB) / 2;
    var scaleY = (h - padT - padB) / 2 / Y_RANGE;

    ctx.clearRect(0, 0, w, h);

    // vertical grid at 0, pi, 2pi
    ctx.lineWidth = 1; ctx.strokeStyle = C.gridS;
    ctx.fillStyle = C.slate2;
    ctx.font = '11px "IBM Plex Mono", monospace';
    ctx.textAlign = "center";
    var marks = [[0, "0"], [0.5, "\u03C0"], [1, "2\u03C0"]];
    for (var m = 0; m < marks.length; m++) {
      var mx = x0 + marks[m][0] * plotW;
      ctx.beginPath(); ctx.moveTo(mx, padT); ctx.lineTo(mx, h - padB); ctx.stroke();
      ctx.fillText(marks[m][1], mx, h - 7);
    }

    // zero axis
    ctx.strokeStyle = C.hair; ctx.lineWidth = 1.25;
    ctx.beginPath(); ctx.moveTo(x0, midY); ctx.lineTo(x1, midY); ctx.stroke();

    if (!frame) return;

    // the curve
    var vals = frame.curve, M = frame.M, px, py, i;
    ctx.beginPath();
    ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.lineWidth = 1.4; ctx.strokeStyle = C.ink;
    for (i = 0; i <= M; i++) {
      px = x0 + (i / M) * plotW;
      py = midY - Math.max(-Y_RANGE, Math.min(Y_RANGE, vals[i % M])) * scaleY;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // zero markers on the axis
    ctx.fillStyle = "rgba(224,73,43,0.78)";
    for (i = 0; i < frame.zeros.length; i++) {
      px = x0 + (frame.zeros[i] / TWO_PI) * plotW;
      ctx.beginPath(); ctx.arc(px, midY, 2.5, 0, TWO_PI); ctx.fill();
    }
  }

  // ---- drawing: convergence -------------------------------------------
  function drawConv(history) {
    var H = Math.max(210, Math.min(300, convCv.clientWidth * 0.46));
    var d = fitCanvas(convCv, H), ctx = d.ctx, w = d.w, h = d.h;
    var padL = 46, padR = 16, padT = 16, padB = 28;
    var x0 = padL, x1 = w - padR, y0 = padT, y1 = h - padB;

    function X(n) { return x0 + (n / N_MAX) * (x1 - x0); }
    function Y(r) {
      var c = Math.max(Y_LO, Math.min(Y_HI, r));
      return y1 - (c - Y_LO) / (Y_HI - Y_LO) * (y1 - y0);
    }

    ctx.clearRect(0, 0, w, h);

    // horizontal grid + y labels
    ctx.font = '11px "IBM Plex Mono", monospace';
    ctx.fillStyle = C.slate2; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    var ticks = [1.0, 1.1, 1.2, 1.3, 1.4, 1.5];
    ctx.lineWidth = 1;
    for (var ti = 0; ti < ticks.length; ti++) {
      var yy = Y(ticks[ti]);
      ctx.strokeStyle = C.gridS;
      ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x1, yy); ctx.stroke();
      ctx.fillText(ticks[ti].toFixed(1), x0 - 8, yy);
    }
    // x labels
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    [0, 25, 50, 75, 100].forEach(function (nn) {
      if (nn > N_MAX) return;
      ctx.fillText(nn === 0 ? "n=0" : String(nn), X(nn), y1 + 7);
    });

    // 2/sqrt3 limit line
    var yT = Y(TARGET);
    ctx.strokeStyle = C.limit; ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(x0, yT); ctx.lineTo(x1, yT); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = C.limit; ctx.textAlign = "left"; ctx.textBaseline = "bottom";
    ctx.fillText("2/\u221A3", X(N_MAX) - 34, yT - 4);

    if (!history.length) return;

    // individual draws (faint dots)
    ctx.fillStyle = "rgba(224,73,43,0.34)";
    for (var i = 0; i < history.length; i++) {
      var hx = X(history[i].n), rs = history[i].ratios;
      for (var k = 0; k < rs.length; k++) {
        ctx.beginPath(); ctx.arc(hx, Y(rs[k]), 1.7, 0, TWO_PI); ctx.fill();
      }
    }

    // exact expected value E[N]/n, revealed up to the current degree
    ctx.strokeStyle = C.ink; ctx.lineWidth = 1.8;
    ctx.lineJoin = "round";
    ctx.beginPath();
    for (i = 0; i < history.length; i++) {
      var mx = X(history[i].n), my = Y(exactRatio(history[i].n));
      if (i === 0) ctx.moveTo(mx, my); else ctx.lineTo(mx, my);
    }
    ctx.stroke();

    // leading point on the expectation curve
    var lastH = history[history.length - 1];
    ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.arc(X(lastH.n), Y(exactRatio(lastH.n)), 3.2, 0, TWO_PI); ctx.fill();
  }

  // ---- readout ---------------------------------------------------------
  function setText(id, v) { document.getElementById(id).textContent = v; }
  function updateReadout(frame) {
    setText("rtp-n", frame.n);
    setText("rtp-z", frame.count);
    setText("rtp-r", frame.mean.toFixed(4));
  }

  // ---- height reporting (lets the parent page size the iframe) ---------
  function reportHeight() {
    try {
      var el = document.querySelector(".rtp");
      var hgt = Math.ceil(el.getBoundingClientRect().height) + 6;
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ rtpZerosHeight: hgt }, "*");
      }
    } catch (e) {}
  }

  // ---- animation loop --------------------------------------------------
  var history = [], currentN = N_START, playing = true, timer = null;
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function intervalMs() {
    var v = +document.getElementById("rtp-speed").value;   // 0..100
    return 360 - (v / 100) * 320;                           // 360ms .. 40ms
  }

  function advance() {
    if (currentN > N_MAX) { stop(); return; }
    var frame = step(currentN);
    history.push(frame);
    drawWave(frame);
    drawConv(history);
    updateReadout(frame);
    currentN++;
  }

  function tick() {
    if (!playing) return;
    advance();
    if (currentN > N_MAX) { stop(); return; }
    timer = setTimeout(tick, intervalMs());
  }
  function start() {
    playing = true;
    document.getElementById("rtp-play").textContent = "Pause";
    clearTimeout(timer);
    tick();
  }
  function stop() {
    playing = false;
    clearTimeout(timer);
    document.getElementById("rtp-play").textContent =
      currentN > N_MAX ? "Replay" : "Play";
  }
  function reset() {
    clearTimeout(timer);
    history = []; currentN = N_START;
    drawWave(null); drawConv(history);
    setText("rtp-n", "\u2014"); setText("rtp-z", "\u2014"); setText("rtp-r", "\u2014");
    start();
  }

  // controls
  document.getElementById("rtp-play").addEventListener("click", function () {
    if (currentN > N_MAX) { reset(); return; }
    if (playing) stop(); else start();
  });
  document.getElementById("rtp-reset").addEventListener("click", reset);

  var resizeTimer;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      drawWave(history.length ? history[history.length - 1] : null);
      drawConv(history);
      reportHeight();
    }, 120);
  });
  window.addEventListener("load", reportHeight);

  // boot
  drawWave(null);
  drawConv(history);
  requestAnimationFrame(reportHeight);
  if (reduce) {
    // honor reduced-motion: build the full picture without animating
    for (var n = N_START; n <= N_MAX; n++) history.push(step(n));
    currentN = N_MAX + 1;
    var lf = history[history.length - 1];
    drawWave(lf); drawConv(history); updateReadout(lf);
    stop();
  } else {
    start();
  }
})();
</script>
</body>
</html>
